<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUPIDO</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" title="CUPIDO — suíte vocal com IA">
      <svg class="wordmark" viewBox="0 0 168 30" aria-label="CUPIDO">
        <text x="0" y="25" fill="#F3E8F6" font-family="Segoe UI Black, Arial Black, Helvetica Neue, sans-serif" font-weight="900" font-size="27" letter-spacing="2">CUPID</text>
        <path transform="translate(118 3) scale(1.05)" fill="#FF3E86" d="M12 23s-10-6.2-10-13.1C2 6 4.6 3.5 7.6 3.5c2 0 3.5 1 4.4 2.6.9-1.6 2.4-2.6 4.4-2.6 3 0 5.6 2.5 5.6 6.4C22 16.8 12 23 12 23z"/>
        <path d="M108 26 L162 2" stroke="#FFC56A" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M162 2 l-7 0.6 l3.6 5.4z" fill="#FFC56A"/>
      </svg>
      <span class="ver" id="ver">v1.0</span>
    </div>

    <div class="preset-bar">
      <button class="ibtn" id="presetPrev" title="Preset anterior" aria-label="Preset anterior"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="preset-name" id="presetOpen" role="button" tabindex="0" title="Abrir presets"><b id="presetName">Init</b><small id="presetCat">Padrão</small></div>
      <button class="ibtn" id="presetNext" title="Próximo preset" aria-label="Próximo preset"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ibtn" id="presetSave" title="Salvar preset">Salvar</button>
    </div>

    <button class="ibtn" id="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 16 16"><path d="M4 6h6a3.5 3.5 0 0 1 0 7H6M4 6l3-3M4 6l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="ibtn" id="redo" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer"><svg viewBox="0 0 16 16"><path d="M12 6H6a3.5 3.5 0 0 0 0 7h4M12 6 9 3m3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="ab" title="Comparar duas versões (A/B)"><button id="slotA" class="on">A</button><button id="slotB">B</button></div>
    <button class="ibtn" id="abCopy" title="Copiar a versão atual para a outra">A→B</button>

    <div class="spacer"></div>
    <span class="mode-pill" id="modePill" title="Clique para alternar"><b>Mixagem HQ</b></span>
    <button class="ibtn" id="helpBtn" title="Ajuda e atalhos" aria-label="Ajuda">?</button>
    <button class="ibtn" id="settingsBtn" title="Configurações da IA e voz" aria-label="Configurações"><svg viewBox="0 0 16 16"><path d="M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Zm5.6 3.6.9.7-1.2 2.1-1.1-.4a5 5 0 0 1-1.3.8l-.2 1.1H6.3l-.2-1.1a5 5 0 0 1-1.3-.8l-1.1.4-1.2-2.1.9-.7a5 5 0 0 1 0-1.6l-.9-.7 1.2-2.1 1.1.4c.4-.3.8-.6 1.3-.8l.2-1.1h2.4l.2 1.1c.5.2.9.5 1.3.8l1.1-.4 1.2 2.1-.9.7a5 5 0 0 1 0 1.6Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
  </header>

  <nav class="rack" id="rack" aria-label="Cadeia de processamento"></nav>

  <main class="module" id="module"></main>

  <footer class="bottom">
    <div class="macros" id="macros"></div>
    <div class="meters" id="meters">
      <div class="meter-row"><span>Entrada</span><div class="bar"><i id="mIn"></i></div></div>
      <div class="meter-row"><span>Saída</span><div class="bar"><i id="mOut"></i></div></div>
      <div class="meter-row"><span>Limiter</span><div class="bar"><i id="mLim" style="background:var(--gold)"></i></div></div>
      <div class="lufs">
        <div><b id="lufsS" class="num">–</b><small>LUFS curto</small></div>
        <div><b id="lufsI" class="num">–</b><small>LUFS integrado</small></div>
        <div><b id="bpmView" class="num">–</b><small>BPM</small></div>
      </div>
    </div>
  </footer>

  <aside class="agent" aria-label="Cupidinho, agente de IA">
    <div class="agent-head">
      <svg class="cupid" id="cupid" viewBox="0 0 64 64" aria-hidden="true">
        <g class="body">
          <path class="wing l" d="M22 34c-9-1-15-7-16-15 6 2 9 1 13 4-5 0-7 1-9 3 4 0 8 1 12 5z" fill="#F6D9EC" stroke="#E3A9CC" stroke-width="1"/>
          <path class="wing r" d="M42 34c9-1 15-7 16-15-6 2-9 1-13 4 5 0 7 1 9 3-4 0-8 1-12 5z" fill="#F6D9EC" stroke="#E3A9CC" stroke-width="1"/>
          <ellipse cx="32" cy="44" rx="9" ry="10" fill="#FFD3B8"/>
          <path d="M23 47c3 4 15 4 18 0v4c-3 3-15 3-18 0z" fill="#FF3E86"/>
          <circle cx="32" cy="27" r="11" fill="#FFDCC4"/>
          <path d="M21.5 25c0-7 5-10 10.5-10s10.5 3 10.5 10c-2-3-4-4-6-4 0 0-1 2-4.5 2S27 21 27 21c-2 0-4 1-5.5 4z" fill="#FFC56A"/>
          <circle cx="28" cy="28" r="1.4" fill="#3A1B2E"/><circle cx="36" cy="28" r="1.4" fill="#3A1B2E"/>
          <path d="M29 32.5c1.6 1.4 4.4 1.4 6 0" fill="none" stroke="#3A1B2E" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="25.5" cy="31" r="1.8" fill="#FF9DBF" opacity=".7"/><circle cx="38.5" cy="31" r="1.8" fill="#FF9DBF" opacity=".7"/>
          <path d="M46 36q8 8 0 16" fill="none" stroke="#C7893A" stroke-width="1.6"/>
          <path d="M46 36 L46 52" stroke="#F3E8F6" stroke-width=".6"/>
          <path d="M40 44h12" stroke="#FFC56A" stroke-width="1.4"/>
          <path d="M53 44l-3-2v4z" fill="#FF3E86"/>
        </g>
      </svg>
      <div>
        <h2>Cupidinho</h2>
        <p id="agentStatus">Fala o que tu quer no som</p>
      </div>
      <div class="grow"></div>
      <span class="ai-mode" id="aiMode" title="Modo do agente">local</span>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <div class="composer">
      <textarea id="input" placeholder="Ex.: bota mais saturação nos agudos e um delay mais demorado" aria-label="Mensagem para o Cupidinho"></textarea>
      <button class="mic" id="micBtn" title="Segura e fala (ou tecla V)" aria-label="Comando de voz"><svg viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 8a5 5 0 0 0 10 0M8 13v2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <button class="send" id="sendBtn">Enviar</button>
    </div>
  </aside>
</div>

<div class="overlay" id="presetModal"><div class="modal" role="dialog" aria-label="Presets"></div></div>
<div class="overlay" id="settingsModal"><div class="modal" role="dialog" aria-label="Configurações"></div></div>
<div class="overlay" id="helpModal"><div class="modal" role="dialog" aria-label="Ajuda"></div></div>
<div class="toast" id="toast"></div>

<script src="params.js"></script>
<script src="presets.js"></script>
<script src="bridge.js"></script>
<script src="agent.js"></script>
<script src="app.js"></script>
</body>
</html>
